name: AI Daily Briefing

on:
  push:
    branches: [main]
    paths:
      - 'briefings/**.md'
  workflow_dispatch:
    inputs:
      file:
        description: '要发送的 briefing 文件路径(留空 = 用最新的)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve briefing file
        id: file
        env:
          INPUT_FILE: ${{ inputs.file }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_FILE:-}" ]; then
            FILE="$INPUT_FILE"
          elif [ "$EVENT" = "push" ]; then
            FILE=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'briefings/*.md' | head -n 1 || true)
          else
            FILE=$(ls -t briefings/*.md 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
            echo "::error::没找到要发送的 briefing 文件 (got: '${FILE:-}')"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Selected: $FILE ($(wc -c <"$FILE") bytes)"

      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE:     ${{ steps.file.outputs.file }}
        run: |
          set -euo pipefail

          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::error::缺少 TELEGRAM_BOT_TOKEN 或 TELEGRAM_CHAT_ID secret"
            exit 1
          fi

          TEXT=$(cat "$FILE")
          LEN=${#TEXT}
          echo "Message length: $LEN chars"

          if [ "$LEN" -gt 4000 ]; then
            echo "::warning::内容超 4000 字符,截断"
            TRUNCATED="${TEXT:0:4000}"
            TEXT=$(printf '%s\n\n%s' "$TRUNCATED" "…(已截断,完整版见仓库 $FILE)")
          fi

          RESP=$(curl -sS -w '\n---HTTP:%{http_code}' \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}")

          echo "$RESP"
          STATUS=$(echo "$RESP" | tail -n1 | sed 's/.*HTTP://')

          if [ "$STATUS" != "200" ]; then
            echo "::error::Telegram API 返回 HTTP $STATUS"
            exit 1
          fi
